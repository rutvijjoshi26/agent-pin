name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Core tests
        run: cargo test --manifest-path crates/agent-pin-core/Cargo.toml

      - name: Core clippy
        run: cargo clippy --manifest-path crates/agent-pin-core/Cargo.toml --all-targets -- -D warnings

      # Glob instead of a bare directory: Node 22's --test treats arguments as
      # glob patterns, and bash expands this one on every OS.
      - name: Web tests
        run: node --test apps/desktop/web/*.test.js
