<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Pin</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="pin" class="pin">
      <header class="pin__header">
        <span class="pin__mark">⌖</span>
        <span class="pin__title" data-expanded-only>Agent Pin</span>
      </header>
      <section id="agents" class="agents"></section>
      <section id="setup" class="setup" data-expanded-only hidden>
        <div class="setup__top">
          <span id="setup-title" class="setup__title">Setup needed</span>
          <button id="setup-button" class="setup__button" type="button">Set up</button>
        </div>
        <div id="setup-detail" class="setup__detail"></div>
        <div id="setup-wayland" class="setup__detail" hidden>On Wayland, always-on-top may not be honored.</div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
