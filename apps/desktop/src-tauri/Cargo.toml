[package]
name = "agent-pin"
version = "0.1.0"
description = "A floating status pin for Claude Code and Codex"
authors = ["Agent Pin contributors"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "agent_pin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agent-pin"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
