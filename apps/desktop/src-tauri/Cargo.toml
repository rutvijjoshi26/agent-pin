[package]
name = "agent-pin"
version = "0.1.0"
description = "A floating status pin for coding agents"
authors = ["Agent Pin contributors"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "agent_pin_lib"

[[bin]]
name = "agent-pin"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri = { version = "2", features = [] }
agent-pin-core = { path = "../../../crates/agent-pin-core" }
